<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rivets 'n Ruin — operator</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="/admin.css">
</head>
<body>

<!-- The way in, and until it works, the whole page.
     The tool used to be here too, under a `hidden` attribute. Nothing
     of it showed, but all of it was served: view source before signing
     in and you had every tab, every button and every route the page
     calls. A login screen that ships the thing it is guarding is a
     login screen in name only.
     The shell is built in admin.js after a password works, and taken
     down again on sign-out. -->
<div id="login">
  <h1>OPERATOR</h1>
  <p>rivets 'n ruin</p>
  <form id="login-form">
    <input id="pw" type="password" autocomplete="current-password" placeholder="password"
           aria-label="Administrator password" autofocus>
    <button type="submit">SIGN IN</button>
  </form>
  <div id="login-note"></div>
</div>

<script type="module" src="/admin.js"></script>
</body>
</html>
